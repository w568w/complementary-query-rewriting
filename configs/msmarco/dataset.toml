[dataset]
name = "msmarco"
corpus_source = "official MS MARCO passage ranking distribution"
normalized_queries = "data/msmarco/queries.jsonl"
normalized_feedback = "data/msmarco/feedback.jsonl"

[difficulty]
metric = "ndcg"
cutoff = 25
maximum_ndcg = 0.2

[split]
group_key = "source_id"
exclude_exact_query_overlap = true
seed = 42

[evaluation]
metric = "ndcg"
cutoffs = [10, 25]
cluster_key = "source_id"
