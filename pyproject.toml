[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "complementary-query-rewriting"
version = "0.2.0"
description = "Retrieval-oriented policy learning with reusable query-rewriting memory"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
data = [
  "datasets==4.4.2",
]
retrieval = [
  "bm25s>=0.2.13",
  "flagembedding>=1.3.3",
  "pystemmer>=3.0.0",
  "safetensors>=0.5.2",
  "torch>=2.6",
]
training = [
  "accelerate>=1.3.0",
  "peft==0.18.0",
  "transformers==4.57.3",
  "trl[vllm]==0.20.0",
]
writer = [
  "openai>=1.61.1",
]
dev = [
  "ruff>=0.12.0",
]

[project.scripts]
cqr = "cqr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cqr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
